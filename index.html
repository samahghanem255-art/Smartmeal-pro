<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Meal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
  <h2 id="title">🍽 Smart Meal</h2>

  <div class="lang">
    <button onclick="setLang('ar')">AR</button>
    <button onclick="setLang('fr')">FR</button>
    <button onclick="setLang('en')">EN</button>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <h1 id="mainTitle">Smart Meal</h1>
  <p id="subtitle">Healthy meals for your day</p>

  <img 
    src="https://images.unsplash.com/photo-1498837167922-ddd27525d352"
    class="hero-img"
  >
</div>

<!-- CARDS -->
<div class="cards">

  <div class="card">
    <h3 id="breakfast">Breakfast</h3>
    <p>Healthy meal</p>
  </div>

  <div class="card">
    <h3 id="lunch">Lunch</h3>
    <p>Balanced meal</p>
  </div>

  <div class="card">
    <h3 id="dinner">Dinner</h3>
    <p>Light meal</p>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
